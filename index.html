<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>マルチプラント HMI モック</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body{font-family:"Noto Sans JP",system-ui,-apple-system;margin:18px;background:#f4f7fb;color:#111}
  h1{margin:0 0 12px 0;font-size:20px}
  .grid{display:flex;gap:14px;flex-wrap:wrap}
  .card{background:#fff;padding:12px;border-radius:10px;box-shadow:0 6px 18px rgba(10,20,40,0.06);width:220px}
  .card .title{font-weight:700;margin-bottom:6px}
  .card .meta{font-size:13px;color:#666}
  .btn{display:inline-block;padding:8px 10px;border-radius:8px;border:0;background:#0b79ff;color:#fff;cursor:pointer}
  .btn.ghost{background:#eee;color:#333}
  .layout{display:flex;gap:16px;margin-top:14px}
  .left{width:280px}
  .main{flex:1}
  #tank{width:200px;height:360px;border-radius:8px;border:4px solid #333;position:relative;overflow:hidden;background:linear-gradient(#fff,#eee);margin:0 auto}
  #water{position:absolute;bottom:0;left:0;width:100%;background:linear-gradient(#4fb,#06f);transition:height 0.6s linear}
  .controls{display:flex;gap:8px;justify-content:center;margin-top:10px}
  label{display:block;margin-top:10px;font-size:13px;color:#444}
  input[type=range]{width:100%}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  th,td{padding:6px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
  .small{font-size:13px;color:#666}
  .topbar{display:flex;justify-content:space-between;align-items:center}
  .plant-header{display:flex;gap:12px;align-items:center}
  .plant-icon{width:48px;height:48px;border-radius:8px;background:#eef;display:flex;align-items:center;justify-content:center;font-weight:700}
  .preset{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .preset button{padding:6px 8px;border-radius:6px;border:0;background:#eee;cursor:pointer}
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>マルチプラント HMI モック</h1>
      <div class="small">複数の工場タイプを切り替えてデモできるフロントのみモック</div>
    </div>
    <div>
      <button id="btn-export" class="btn ghost">全履歴をCSV</button>
      <button id="btn-reset-all" class="btn ghost">全リセット</button>
    </div>
  </div>

  <!-- プラント一覧 -->
  <div style="margin-top:12px">
    <div class="small">プラント一覧</div>
    <div class="grid" id="plant-grid"></div>
  </div>

  <!-- レイアウト: 左にプラント概要、右にメイン -->
  <div class="layout">
    <div class="left card" id="left-panel">
      <div class="plant-header">
        <div id="plant-icon" class="plant-icon">P</div>
        <div>
          <div id="plant-name" style="font-weight:700">選択してください</div>
          <div id="plant-type" class="small">—</div>
        </div>
      </div>

      <div id="plant-desc" class="small" style="margin-top:8px">プラントを選ぶと詳細が表示されます。</div>

      <div style="margin-top:12px">
        <label>プリセット</label>
        <div class="preset" id="preset-list"></div>
      </div>

      <div style="margin-top:12px">
        <label>擬似タグ（HR/Coil）</label>
        <div id="tag-panel" style="max-height:220px;overflow:auto"></div>
      </div>
    </div>

    <div class="main card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:700">ダッシュボード</div>
        <div class="small">URLハッシュで共有可</div>
      </div>

      <div style="display:flex;gap:18px;margin-top:12px">
        <div style="flex:0 0 220px">
          <div id="tank"><div id="water" style="height:20%"></div></div>
          <div style="text-align:center;margin-top:8px;font-weight:700">水位: <span id="level">20</span>%</div>
          <div class="controls">
            <button id="btn-on" class="btn">ポンプ ON</button>
            <button id="btn-off" class="btn ghost">ポンプ OFF</button>
          </div>
          <div style="text-align:center;margin-top:8px" class="small">ポンプ: <span id="pump-state">OFF</span></div>
        </div>

        <div style="flex:1">
          <canvas id="chart" height="140"></canvas>
          <div style="display:flex;gap:8px;margin-top:10px">
            <div style="flex:1">
              <label>更新間隔（ms） <span id="lbl-interval">1000</span></label>
              <input id="inp-interval" type="range" min="200" max="2000" step="100" value="1000">
              <label>注入量（%/tick） <span id="lbl-fill">2</span></label>
              <input id="inp-fill" type="range" min="0" max="10" step="0.5" value="2">
              <label>減少量（%/tick） <span id="lbl-drain">1</span></label>
              <input id="inp-drain" type="range" min="0" max="5" step="0.1" value="1">
            </div>

            <div style="width:220px">
              <label>シナリオ</label>
              <div style="display:flex;gap:8px">
                <button id="btn-record" class="btn ghost">録画</button>
                <button id="btn-play" class="btn ghost">再生</button>
                <button id="btn-clear" class="btn ghost">クリア</button>
              </div>
              <label style="margin-top:8px">ログ</label>
              <div id="log" style="height:120px;overflow:auto;background:#0b1220;color:#cfefff;padding:8px;border-radius:6px;font-family:monospace;font-size:12px"></div>
            </div>
          </div>
        </div>
      </div>

      <div style="margin-top:12px">
        <label class="small">プラント固有のメタデータ</label>
        <div id="meta-panel" class="small"></div>
      </div>
    </div>
  </div>

<script>
/* ----- プラント定義（ここに好きなだけ追加） ----- */
const PLANTS = [
  { id:'waterworks', name:'浄水場A', type:'水処理', color:'#0b79ff', desc:'飲料水処理プラント。流量と水位管理が重要。', meta:{location:'仙台市', operator:'市水道局'}, presets:[
    {id:'normal', name:'通常運転', water:40, pump:false},
    {id:'high', name:'高需要', water:60, pump:true},
    {id:'alarm', name:'漏水アラーム', water:90, pump:true}
  ]},
  { id:'brewery', name:'ブルワリーB', type:'食品（醸造）', color:'#ff7a00', desc:'発酵タンクや温度管理を模擬。', meta:{location:'福島', operator:'クラフト社'}, presets:[
    {id:'ferment', name:'発酵中', water:55, pump:false},
    {id:'transfer', name:'移送中', water:30, pump:true}
  ]},
  { id:'chemical', name:'化学工場C', type:'化学', color:'#8b2cff', desc:'薬液タンクとバルブ操作のデモ。', meta:{location:'茨城', operator:'化学X'}, presets:[
    {id:'idle', name:'待機', water:20, pump:false},
    {id:'process', name:'処理中', water:70, pump:true}
  ]},
  { id:'power', name:'発電所D', type:'発電', color:'#22c55e', desc:'冷却水タンクや循環ポンプの模擬。', meta:{location:'宮城', operator:'電力Y'}, presets:[
    {id:'standby', name:'待機', water:50, pump:false},
    {id:'peak', name:'ピーク運転', water:80, pump:true}
  ]}
];

/* ----- 状態管理 ----- */
let currentPlant = null;
const plantState = {}; // plantId -> {water,pump,history,registers,coils}
function ensurePlantState(id){
  if(!plantState[id]){
    plantState[id] = {
      water:20, pump:false, history:[], registers:new Array(20).fill(0), coils:new Array(10).fill(false), scenario:[]
    };
  }
  return plantState[id];
}

/* ----- UI 初期化 ----- */
const grid = document.getElementById('plant-grid');
PLANTS.forEach(p=>{
  const div = document.createElement('div'); div.className='card';
  div.innerHTML = `<div class="title">${p.name}</div><div class="meta">${p.type}</div><div style="margin-top:8px" class="small">${p.desc}</div><div style="margin-top:8px"><button class="btn" data-id="${p.id}">開く</button></div>`;
  grid.appendChild(div);
});
grid.querySelectorAll('button').forEach(b=>b.addEventListener('click', e=>{
  const id = e.target.dataset.id; openPlant(id);
}));

/* ----- Chart.js ----- */
const ctx = document.getElementById('chart').getContext('2d');
const chart = new Chart(ctx, {
  type:'line',
  data:{labels:[],datasets:[{label:'水位 %',data:[],borderColor:'#0b79ff',backgroundColor:'rgba(11,121,255,0.08)',tension:0.2}]},
  options:{animation:false,scales:{x:{display:false},y:{min:0,max:100}}}
});

/* ----- DOM refs ----- */
const el = id => document.getElementById(id);
const logEl = el('log');

/* ----- 操作ログ ----- */
function log(msg){ const t=new Date().toLocaleTimeString(); logEl.innerText = `[${t}] ${msg}\n` + logEl.innerText; }

/* ----- プラントを開く ----- */
function openPlant(id){
  const p = PLANTS.find(x=>x.id===id); if(!p) return;
  currentPlant = p;
  location.hash = `plant=${id}`; // 共有用
  el('plant-name').innerText = p.name;
  el('plant-type').innerText = p.type;
  el('plant-desc').innerText = p.desc;
  el('plant-icon').style.background = p.color; el('plant-icon').innerText = p.name[0];
  el('meta-panel').innerText = Object.entries(p.meta).map(([k,v])=>`${k}: ${v}`).join('  ');
  // ensure state
  const s = ensurePlantState(id);
  // apply presets UI
  const presetList = el('preset-list'); presetList.innerHTML='';
  p.presets.forEach(ps=>{
    const btn = document.createElement('button'); btn.textContent = ps.name;
    btn.addEventListener('click', ()=>{ applyPreset(id, ps); });
    presetList.appendChild(btn);
  });
  // render tags
  renderTagPanel(id);
  // load chart/history
  renderChart(id);
  updateMainUI(id);
  log(`プラント ${p.name} を開きました`);
}

/* ----- プリセット適用 ----- */
function applyPreset(id, preset){
  const s = ensurePlantState(id);
  s.water = preset.water;
  s.pump = preset.pump;
  s.history.push({t:Date.now(), water:s.water, pump:s.pump});
  renderChart(id);
  updateMainUI(id);
  log(`プリセット ${preset.name} を適用`);
}

/* ----- タグパネル（擬似Modbus） ----- */
function renderTagPanel(id){
  const s = ensurePlantState(id);
  const panel = el('tag-panel'); panel.innerHTML='';
  const hrTitle = document.createElement('div'); hrTitle.className='small'; hrTitle.innerText='HR (保持レジスタ)';
  panel.appendChild(hrTitle);
  const table = document.createElement('table'); table.innerHTML = '<thead><tr><th>addr</th><th>value</th></tr></thead><tbody></tbody>';
  panel.appendChild(table);
  const tbody = table.querySelector('tbody');
  s.registers.forEach((v,i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i}</td><td><input data-addr="${i}" style="width:80px" value="${v}"></td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const a = Number(e.target.dataset.addr);
      s.registers[a] = Number(e.target.value);
      log(`HR[${a}] = ${s.registers[a]}`);
    });
  });
  const coilTitle = document.createElement('div'); coilTitle.className='small'; coilTitle.innerText='Coil';
  panel.appendChild(coilTitle);
  const table2 = document.createElement('table'); table2.innerHTML = '<thead><tr><th>addr</th><th>state</th></tr></thead><tbody></tbody>';
  panel.appendChild(table2);
  const tbody2 = table2.querySelector('tbody');
  s.coils.forEach((v,i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i}</td><td><input type="checkbox" data-addr="${i}" ${v?'checked':''}></td>`;
    tbody2.appendChild(tr);
  });
  tbody2.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const a = Number(e.target.dataset.addr);
      s.coils[a] = e.target.checked;
      log(`Coil[${a}] = ${s.coils[a]}`);
      if(a===0){ s.pump = s.coils[0]; updateMainUI(currentPlant.id); }
    });
  });
}

/* ----- メインUI更新 ----- */
function updateMainUI(id){
  const s = ensurePlantState(id);
  el('level').innerText = Math.round(s.water);
  el('water').style.height = Math.max(0,Math.min(100,s.water)) + '%';
  el('pump-state').innerText = s.pump ? 'ON' : 'OFF';
}

/* ----- Chart 更新 ----- */
function renderChart(id){
  const s = ensurePlantState(id);
  // ensure at least one sample
  if(s.history.length===0) s.history.push({t:Date.now(), water:s.water, pump:s.pump});
  chart.data.labels = s.history.map(h=>new Date(h.t).toLocaleTimeString());
  chart.data.datasets[0].data = s.history.map(h=>h.water);
  chart.update();
}

/* ----- 操作関数 ----- */
function setPump(id, v){
  const s = ensurePlantState(id);
  s.pump = v;
  s.coils[0] = v;
  s.history.push({t:Date.now(), water:s.water, pump:s.pump});
  updateMainUI(id); renderChart(id);
  log(`${currentPlant.name} のポンプを ${v?'ON':'OFF'}`);
}

/* ----- シミュレーション tick ----- */
let tickTimer = null;
function tickAll(){
  PLANTS.forEach(p=>{
    const s = ensurePlantState(p.id);
    // simple physics: pump increases, else decreases
    if(s.pump) s.water += Number(el('inp-fill').value || 2);
    else s.water -= Number(el('inp-drain').value || 1);
    s.water = Math.max(0, Math.min(100, s.water));
    s.history.push({t:Date.now(), water:s.water, pump:s.pump});
    if(currentPlant && currentPlant.id===p.id){
      updateMainUI(p.id); renderChart(p.id);
    }
  });
}

/* ----- タイマー管理 ----- */
function restartTick(){
  if(tickTimer) clearInterval(tickTimer);
  const interval = Number(el('inp-interval').value || 1000);
  tickTimer = setInterval(tickAll, interval);
  el('lbl-interval').innerText = interval;
}
el('inp-interval').addEventListener('input', restartTick);
el('inp-fill').addEventListener('input', ()=> el('lbl-fill').innerText = el('inp-fill').value);
el('inp-drain').addEventListener('input', ()=> el('lbl-drain').innerText = el('inp-drain').value);

/* ----- ボタンイベント ----- */
el('btn-on').addEventListener('click', ()=> { if(!currentPlant) return; setPump(currentPlant.id, true); });
el('btn-off').addEventListener('click', ()=> { if(!currentPlant) return; setPump(currentPlant.id, false); });
el('btn-reset-all').addEventListener('click', ()=> {
  Object.keys(plantState).forEach(k=>{ plantState[k].water=20; plantState[k].pump=false; plantState[k].history=[]; });
  if(currentPlant) { updateMainUI(currentPlant.id); renderChart(currentPlant.id); }
  log('全プラントをリセットしました');
});
el('btn-export').addEventListener('click', ()=> {
  // 全プラントの履歴をCSVで出力
  let csv = 'plant,time,water,pump\n';
  Object.entries(plantState).forEach(([pid,s])=>{
    s.history.forEach(h=> csv += `${pid},${new Date(h.t).toISOString()},${h.water},${h.pump}\n`);
  });
  const blob = new Blob([csv], {type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='all_plants_history.csv'; a.click();
});

/* ----- シナリオ録画/再生（簡易） ----- */
let recording=false; el('btn-record').addEventListener('click', ()=>{
  if(!currentPlant) return;
  recording = !recording; el('btn-record').textContent = recording ? '録画中…' : '録画';
  if(recording){ plantState[currentPlant.id].scenario = []; log('録画開始'); }
  else log('録画停止');
});
el('btn-play').addEventListener('click', async ()=>{
  if(!currentPlant) return;
  const s = ensurePlantState(currentPlant.id);
  if(!s.scenario || s.scenario.length===0){ log('シナリオがありません'); return; }
  log('シナリオ再生開始');
  for(const ev of s.scenario){
    await new Promise(r=>setTimeout(r, ev.delay));
    if(ev.type==='pump') setPump(currentPlant.id, ev.value);
    if(ev.type==='param') Object.assign(s, ev.value);
  }
  log('シナリオ再生終了');
});
el('btn-clear').addEventListener('click', ()=> { if(!currentPlant) return; plantState[currentPlant.id].scenario=[]; log('シナリオをクリア'); });

/* ----- 録画用フック（簡易） ----- */
function recordEvent(pid, ev){
  if(!recording) return;
  const s = ensurePlantState(pid);
  s.scenario.push({type:ev.type, value:ev.value, delay: Number(el('inp-interval').value || 1000)});
}

/* ----- 初期化 ----- */
function initFromHash(){
  const h = location.hash.slice(1);
  if(!h) return;
  const params = Object.fromEntries(h.split('&').map(p=>p.split('=')));
  if(params.plant) openPlant(params.plant);
}
function init(){
  // ensure states
  PLANTS.forEach(p=> ensurePlantState(p.id));
  initFromHash();
  restartTick();
  log('初期化完了');
}
init();

/* ----- URLハッシュで共有可能（例: #plant=brewery） ----- */
window.addEventListener('hashchange', ()=> initFromHash());
</script>
</body>
</html>
